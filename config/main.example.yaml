# =============================================================================
# RESOURCE MONITORING CONFIGURATION
# =============================================================================
resource_monitor:
  # Enable or disable resource monitoring
  enabled: true

  # Action when thresholds exceeded: restart_services, notify, both
  action_on_threshold: "both"

  # Number of processes shown in each diagnostic ranking section.
  # Applies to CPU %, CPU core load, RAM, disk I/O, and network reports.
  top_process_limit: 10

  # CPU load monitoring
  cpu_load:
    enabled: true
    # Enable checks for specific load averages
    check_1min: true
    check_5min: false
    check_15min: false
    # Thresholds for each check
    threshold_1min: 99.0
    threshold_5min: 80.0
    threshold_15min: 60.0
    # Optional recovery command executed when threshold is exceeded
    # recovery_command: "systemctl restart nginx"

  # Memory monitoring
  memory:
    enabled: true
    # Trigger condition: "or" or "and"
    condition: "or"
    # Minimum free memory percent
    free_percent_threshold: 5.0
    # Minimum free memory MB
    free_mb_threshold: 512
    # Actions when threshold exceeded
    action_on_threshold: "both"

  # Disk monitoring
  disk:
    enabled: false
    # Backward compatible key: paths (same as mount_points)
    # List of mount points to monitor
    # Supports per-mount overrides for thresholds
    mount_points:
      - path: "/"
        # Optional per-mount overrides
        # free_percent_threshold: 10.0
        # free_gb_threshold: 5.0
        # free_mb_threshold: 1024
    # Minimum free percent threshold
    free_percent_threshold: 10.0
    # Minimum free space in GB (optional)
    free_gb_threshold: 5.0
    # Minimum free MB threshold
    free_mb_threshold: 1024
    # Action on low disk.
    # Supported values:
    #   - notify: keep the existing low-disk recovery flow without filesystem cleanup.
    #   - cleanup: run the quarantine-based cleanup flow only.
    #   - both: run quarantine-based cleanup first, then execute low_disk_services.
    action_on_threshold: "notify"

    # Quarantine-first disk cleanup settings.
    # Cleanup is only attempted when action_on_threshold is set to "cleanup" or "both".
    cleanup:
      # Enable or disable automatic cleanup for low-disk events.
      enabled: false
      # Cleanup mode.
      # Supported values:
      #   - quarantine_then_delete: move matching files/directories into quarantine first.
      #     Permanent deletion must only happen later from inside quarantine.
      mode: "quarantine_then_delete"
      # Absolute path of the quarantine directory.
      # This directory stores moved items plus JSON manifests used for restore operations.
      quarantine_dir: "/opt/xnetvn_monitord/.local/quarantine"
      # Allow directory candidates in addition to files.
      # Supported values:
      #   - false: only individual files may be quarantined.
      #   - true: matched directories may also be quarantined as a whole tree.
      allow_directories: false
      # Hard cap on how many matching candidates one cleanup run may quarantine.
      max_items_per_run: 100
      # Hard cap on how long one cleanup scan may spend walking the filesystem.
      # Keep this low to reduce CPU, I/O, and metadata pressure on busy servers.
      max_runtime_seconds: 30

      # Path selector rules.
      # Matching is applied against normalized absolute paths.
      selectors:
        # Include selectors define which paths are eligible for cleanup.
        include:
          # Selector type.
          # Supported values:
          #   - exact: path must match the pattern exactly.
          #   - regex: Python regular expression matched against the normalized absolute path.
          #   - glob: shell-style glob matched against the normalized absolute path.
          - type: "glob"
            # Example: recursively match cache files below /var/cache/app.
            pattern: "/var/cache/app/**/*.tmp"
        # Exclude selectors short-circuit traversal and cleanup for matching paths.
        exclude:
          - type: "exact"
            pattern: "/var/cache/app/keep"

      # Candidate qualification rules.
      rules:
        # File system object types that may be quarantined.
        # Supported values inside the list: file, directory
        file_types:
          - "file"
        # Minimum candidate age in days based on last modification time.
        min_age_days: 7
        # Minimum candidate size in megabytes.
        min_size_mb: 10

      # Safety controls.
      safety:
        # Require the quarantine directory to live on the same filesystem device as the target mount.
        # This keeps restore semantics predictable and avoids cross-device move surprises.
        require_quarantine_same_filesystem: true
        # Additional absolute paths that must never be scanned or quarantined.
        # Built-in Linux safety paths are enforced automatically even when this list is empty.
        protected_paths:
          - "/var/lib/mysql"

  # Resource recovery actions
  recovery_actions:
    # Cooldown between recovery actions (seconds)
    cooldown_period: 1800
    # Delay between restarting each service (seconds)
    restart_interval: 5
    # Services to restart on high CPU load
    high_cpu_services:
      - "nginx"
      - "php8.2-fpm"
    # Services to restart on low memory
    low_memory_services:
      - "redis-server"
    # Services to restart on low disk space
    low_disk_services:
      - "mysql"

# =============================================================================
# NOTIFICATIONS CONFIGURATION
# =============================================================================
notifications:
  # Enable or disable notifications globally
  enabled: true

  # When a channel enables include_system_stats, alerts include safe
  # top-process diagnostics for CPU %, CPU core load, RAM, disk I/O, and
  # best-effort network throughput. The number of entries per section comes
  # from resource_monitor.top_process_limit (default: 10).
  # Process-level network Mbps requires an optional collector such as nethogs
  # and enough privileges; otherwise the notification marks that metric as
  # unavailable instead of guessing.

  # Minimum severity to send notifications
  # debug, info, low, medium, high, critical
  min_severity: "info"

  # Rate limiting configuration (per event type)
  rate_limit:
    enabled: true
    # Minimum interval between notifications (seconds)
    min_interval: 300
    # Maximum notifications per hour
    max_per_hour: 20

  # Sensitive content filter configuration
  content_filter:
    enabled: true
    # List of regex patterns to mask in notification content
    redact_patterns:
      - "(?i)password=\\S+"
      - "(?i)token=\\S+"
    # Replacement string
    redact_replacement: "[REDACTED]"

  # Email notifications
  email:
    # Enable email notifications
    enabled: false
    # From address used in outgoing emails
    from_address: "monitor@example.com"
    # From display name
    from_name: "xNetVN Monitor"
    # List of recipient addresses
    to_addresses:
      - "ops@example.com"
    # Subject prefix for outgoing emails
    subject_prefix: "[xNetVN Monitor]"
    # Include hostname in email subject
    include_hostname: true
    # Email template configuration
    template:
      # Format: plain | html
      format: "plain"
    smtp:
      # SMTP server hostname or IP
      host: "smtp.example.com"
      # SMTP port (usually 587 for STARTTLS)
      port: 587
      # Enable TLS/STARTTLS
      use_tls: true
      # Enable SSL (alternative to STARTTLS)
      use_ssl: false
      # SMTP username
      username: "monitor@example.com"
      # SMTP password (use environment variable in production)
      password: "${EMAIL_PASSWORD}"
      # SMTP connection timeout (seconds)
      timeout: 30
    # Per-channel minimum severity
    min_severity: "info"
    # Optional rate limit override for email
    # rate_limit:
    #   enabled: true
    #   min_interval: 300
    #   max_per_hour: 20
    # Include system resource stats in email body
    include_system_stats: true
    # Include recovery action details in email body
    include_action_details: true
    # Include detailed event payload
    include_details: true

  # Telegram notifications
  telegram:
    # Enable Telegram notifications
    enabled: false
    # Bot token (BotFather)
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    # Proxy configuration for Telegram API calls
    proxy:
      # Enable or disable proxy routing for network requests
      enabled: false
      # Proxy URI (HTTP/HTTPS/SOCKS5). Example:
      #   http://user:pass@127.0.0.1:8080
      #   https://proxy.example.com:8443
      #   socks5://user:pass@127.0.0.1:1080
      uri: "${PROXY_URI}"
    # List of chat IDs to receive alerts
    chat_ids:
      # - "-100XXXX"  # Example group chat ID
      # - "-100XXXX_YYY"  # Example group chat ID (100XXXX) with Topic ID (YYY)
      # - "123456789" # Example individual chat ID
    # Parse mode: HTML | Markdown
    parse_mode: "HTML"
    # Disable link previews
    disable_preview: true
    # Telegram API timeout (seconds)
    timeout: 30
    # Per-channel minimum severity
    min_severity: "info"
    # Optional rate limit override for Telegram
    # rate_limit:
    #   enabled: true
    #   min_interval: 300
    #   max_per_hour: 20
    # Include system resource stats in Telegram messages
    include_system_stats: false
    # Include recovery action details in Telegram messages
    include_action_details: true
    # Include detailed event payload
    include_details: true

  # Slack notifications
  slack:
    # Enable Slack notifications
    enabled: false
    # Incoming webhook URL
    webhook_url: "${SLACK_WEBHOOK_URL}"
    # Proxy configuration for Slack webhook calls
    proxy:
      # Enable or disable proxy routing for network requests
      enabled: false
      # Proxy URI (HTTP/HTTPS/SOCKS5). Example:
      #   http://user:pass@127.0.0.1:8080
      #   https://proxy.example.com:8443
      #   socks5://user:pass@127.0.0.1:1080
      uri: "${PROXY_URI}"
    # Default channel for messages
    channel: "#server-alerts"
    # Bot display name
    username: "xNetVN Monitor"
    # Optional icon emoji or icon URL
    icon_emoji: ":satellite:"
    # icon_url: "https://example.com/icon.png"
    # Verify SSL certificates
    verify_ssl: true
    # Slack API timeout (seconds)
    timeout: 30
    # Send test notification on startup
    test_on_startup: false
    # Per-channel minimum severity
    min_severity: "medium"
    # Optional rate limit override for Slack
    # rate_limit:
    #   enabled: true
    #   min_interval: 300
    #   max_per_hour: 20

  # Discord notifications
  discord:
    # Enable Discord notifications
    enabled: false
    # Discord webhook URL
    webhook_url: "${DISCORD_WEBHOOK_URL}"
    # Proxy configuration for Discord webhook calls
    proxy:
      # Enable or disable proxy routing for network requests
      enabled: false
      # Proxy URI (HTTP/HTTPS/SOCKS5). Example:
      #   http://user:pass@127.0.0.1:8080
      #   https://proxy.example.com:8443
      #   socks5://user:pass@127.0.0.1:1080
      uri: "${PROXY_URI}"
    # Bot display name
    username: "xNetVN Monitor"
    # Optional avatar URL
    # avatar_url: "https://example.com/avatar.png"
    # Verify SSL certificates
    verify_ssl: true
    # Discord API timeout (seconds)
    timeout: 30
    # Send test notification on startup
    test_on_startup: false
    # Per-channel minimum severity
    min_severity: "medium"
    # Optional rate limit override for Discord
    # rate_limit:
    #   enabled: true
    #   min_interval: 300
    #   max_per_hour: 20

  # Webhook notifications
  webhook:
    # Enable generic webhook notifications
    enabled: false
    # Single webhook URL (use urls for multiple endpoints)
    # url: "${WEBHOOK_URL}"
    # Proxy configuration for webhook calls
    proxy:
      # Enable or disable proxy routing for network requests
      enabled: false
      # Proxy URI (HTTP/HTTPS/SOCKS5). Example:
      #   http://user:pass@127.0.0.1:8080
      #   https://proxy.example.com:8443
      #   socks5://user:pass@127.0.0.1:1080
      uri: "${PROXY_URI}"
    # List of webhook URLs
    urls:
      - "${WEBHOOK_URL_1}"
    # Optional custom headers
    headers:
      X-Source: "xnetvn_monitord"
    # Verify SSL certificates
    verify_ssl: true
    # Webhook timeout (seconds)
    timeout: 30
    # Send test notification on startup
    test_on_startup: false
    # Per-channel minimum severity
    min_severity: "info"
    # Optional rate limit override for webhook
    # rate_limit:
    #   enabled: true
    #   min_interval: 300
    #   max_per_hour: 20
