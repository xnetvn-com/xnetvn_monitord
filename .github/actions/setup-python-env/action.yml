name: 'Setup Python Environment'
description: 'Setup Python with pip caching and install dependencies'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  cache-dependency-path:
    description: 'Path to requirements file for cache key'
    required: false
    default: 'requirements-dev.txt'
  install-dependencies:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'
  dependencies-file:
    description: 'Dependencies file to install'
    required: false
    default: 'requirements-dev.txt'
runs:
  using: 'composite'
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install OS packages (needed for some Python versions)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-distutils python3-venv build-essential

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ inputs.dependencies-file }}
