    - name: "php-fpm-units"
      enabled: false
      check_method: "systemctl"
      # Match all php-fpm unit variants (php7.x-fpm, php8.x-fpm, ...)
      service_name_pattern: 'php.*-fpm\.service'
      restart_command: "systemctl restart php*-fpm"
      critical: true
