name: CI Lint

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-distutils python3-venv build-essential || true
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Black (check)
        run: python -m black --check src tests

      - name: Isort (check)
        run: python -m isort --check-only src tests

      - name: Flake8
        run: python -m flake8 src tests

      - name: Mypy
        continue-on-error: true
        run: python -m mypy src

      - name: ShellCheck scripts
        run: shellcheck scripts/*.sh
