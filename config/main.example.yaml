# EXAMPLE CONFIGURATION FILE
# Copy this file to main.yaml and customize for your environment
# cp config/main.example.yaml config/main.yaml

# For detailed documentation, see config/main.yaml
# Sensitive values should be set via environment variables
# Environment file loaded by default: /opt/xnetvn_monitord/config/.env

# =============================================================================
# GENERAL SETTINGS
# =============================================================================
general:
  # Application name (used in logs and notifications)
  app_name: "xnetvn_monitord"

  # Monitoring loop interval in seconds
  # This is the global loop frequency, not the per-service check interval
  check_interval: 60

  # Logging configuration
  logging:
    # Enable or disable logging entirely
    enabled: true

    # Log verbosity for both the rotating log file and stdout handler.
    # Supported values (case-insensitive): DEBUG, INFO, WARNING, ERROR, CRITICAL
    # DEBUG: verbose diagnostic output for troubleshooting and test runs.
    # INFO: default operational events such as startup, checks, and actions.
    # WARNING: unexpected but recoverable conditions that need review.
    # ERROR: failed operations, recovery attempts, or check execution errors.
    # CRITICAL: severe failures that can prevent normal monitoring operation.
    # Invalid values are rejected during configuration loading to avoid unclear
    # startup failures later in the daemon lifecycle.
    level: "INFO"

    # Enable expanded host-level diagnostics when level=DEBUG.
    # false: DEBUG emits internal observability through the normal handlers,
    #        including decision paths, retry timing, command previews, HTTP
    #        previews, and resource snapshots gathered directly by the daemon.
    # true:  Writes observability traffic into a dedicated deep debug log file
    #        and adds a curated startup host sweep with /proc telemetry,
    #        selected core system logs, work_dir metadata, and host command
    #        previews. Binary files and noisy app/web logs are skipped.
    # Runtime override:
    #   XNETVN_MONITORD_DEEP_DEBUG=1 enables deep debug when level=DEBUG.
    #   XNETVN_MONITORD_DEEP_DEBUG=0 forces deep debug off.
    deep_debug: false

    # Optional dedicated log file for deep debug output.
    # When deep_debug=true, observability events stay in this file instead of
    # being duplicated into the normal rotating monitor log.
    # Default behavior derives this from the main log file and uses a sibling
    # file named deep-debug.log.
    deep_debug_file: "/var/log/xnetvn_monitord/deep-debug.log"

    # Maximum deep debug log file size (MB) before rotation.
    deep_debug_max_size_mb: 100

    # Number of rotated deep debug log files to keep.
    deep_debug_backup_count: 10

    # Maximum number of characters stored for stdout/stderr, HTTP,
    # and selected host-log line previews.
    preview_chars: 256

    # Log file path (ensure directory is writable)
    file: "/var/log/xnetvn_monitord/monitor.log"

    # Maximum log file size (MB) before rotation
    max_size_mb: 100

    # Number of rotated log files to keep
    backup_count: 10

    # Log format string
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # PID file location for daemon
  pid_file: "/var/run/xnetvn_monitord.pid"

  # Working directory for runtime operations
  work_dir: "/opt/xnetvn_monitord"

# =============================================================================
# NETWORK SETTINGS
# =============================================================================
network:
  # Force outbound connections to use IPv4 only
  # When true, DNS resolution will only return IPv4 addresses
  only_ipv4: false

# =============================================================================
# UPDATE CHECKER CONFIGURATION
# =============================================================================
update_checker:
  # Enable or disable automatic update checks
  enabled: true

  # Proxy configuration for update checks
  proxy:
    # Enable or disable proxy routing for network requests
    enabled: false
    # Proxy URI (HTTP/HTTPS/SOCKS5). Example:
    #   http://user:pass@127.0.0.1:8080
    #   https://proxy.example.com:8443
    #   socks5://user:pass@127.0.0.1:1080
    uri: "${PROXY_URI}"

  # Check interval configuration
  # Supported units: hours, days, weeks
  interval:
    value: 1
    unit: "weeks"

  # Notify through enabled channels when a new version is available
  notify_on_update: false

  # Automatically update to the latest release (best-effort)
  auto_update: false

  # GitHub repository for release checks
  github_repo: "xnetvn-com/xnetvn_monitord"

  # GitHub API base URL
  github_api_base_url: "https://api.github.com"

  # Optional GitHub token to avoid rate limits
  # Set via environment variable: GITHUB_TOKEN

  # State file used to store last check time
  state_file: "/opt/xnetvn_monitord/.local/tmp/update_check.json"

  # Service name used for restart after update
  service_name: "xnetvn_monitord"

# =============================================================================
# SERVICE MONITORING CONFIGURATION
# =============================================================================
service_monitor:
  # Enable or disable service monitoring
  enabled: true

  # Default proxy configuration for HTTP/HTTPS checks
  # Individual services can override this with service-level proxy settings.
  proxy:
    # Enable or disable proxy routing for network requests
    enabled: false
    # Proxy URI (HTTP/HTTPS/SOCKS5). Example:
    #   http://user:pass@127.0.0.1:8080
    #   https://proxy.example.com:8443
    #   socks5://user:pass@127.0.0.1:1080
    uri: "${PROXY_URI}"

  # Action on failure: restart, restart_and_notify
  action_on_failure: "restart_and_notify"

  # Default per-service check interval
  # Supports value+unit: seconds, minutes, hours
  check_interval:
    value: 60
    unit: "seconds"

  # Default action cooldown to avoid too frequent recovery actions
  action_cooldown:
    value: 5
    unit: "minutes"

  # Maximum restart attempts within the window
  max_restart_attempts: 3

  # Wait time between restart attempts (seconds)
  restart_wait_time: 10

  # Cooldown after successful restart (seconds)
  restart_cooldown: 300

  # Services list
  # Each entry supports:
  # - name: Friendly display name used in logs/notifications
  # - enabled: Enable/disable the check without removing the entry
  # - check_method: systemctl | auto | service | openrc | process | process_regex
  #   | custom_command | iptables | http | https
  # - service_name: Service unit name (systemctl/auto/service/openrc)
  # - service_name_pattern: Regex to match multiple systemd units (systemctl only)
  # - process_name: Exact process name (process only)
  # - process_pattern/process_patterns: Regex pattern(s) for ps output (process_regex)
  # - multi_instance: Enable multi-instance checks (process_regex only)
  # - instances: List of instance definitions when multi_instance is true
  #   - service_name: systemd unit name for each instance
  # - check_command/check_timeout: Custom command and timeout (custom_command only)
  # - url/http_method/headers/timeout_seconds/expected_status_codes/
  #   max_response_time_ms/verify_tls: HTTP/HTTPS health checks
  #   `url` accepts a single string or a list of URLs.
  # - condition: URL failure logic for multi-target HTTP/HTTPS checks
  #   `or` = any failed URL triggers recovery, `and` = all URLs must fail
  # - restart_command: Recovery command to execute on failure.
  #   Supports a single command string or a list of commands executed in order.
  #   External scripts are supported (bash/php/python, etc.).
  # - pre_restart_hook/post_restart_hook: Optional hooks before/after recovery
  # - check_interval/action_cooldown: Per-service overrides for frequency/cooldown
  # - critical/description: Notification metadata
  # - XNETVN_SERVICE_MANAGER: Optional override for service manager detection
  #   Values: systemd | openrc | sysv
  services:
    # Example: systemd service by exact unit name
    - name: "nginx"
      # Enable or disable this service check
      enabled: false
      # Check method: systemctl, auto, service, openrc, process, process_regex,
      # custom_command, http, https
      check_method: "systemctl"
      # Exact systemd unit name
      service_name: "nginx"
      # Optional regex to match multiple systemd units
      # service_name_pattern: "php.*-fpm\.service"
      # Example: execute multiple commands in order
      restart_command:
        - "systemctl restart nginx"
        #- "systemctl restart php*-fpm"
        #- "bash /opt/xnetvn_monitord/scripts/custom-restart.sh" # Custom script
      # Per-service check interval override
      check_interval:
        value: 30
        unit: "seconds"
      # Per-service action cooldown override
      action_cooldown:
        value: 10
        unit: "minutes"
      # Mark as critical for higher severity notifications
      critical: true
      # Description shown in notifications
      description: "Nginx HTTP server"
      # Optional hooks before and after restart
      pre_restart_hook: ""
      post_restart_hook: ""

    # Example: process regex check (matches command line)
    - name: "php-fpm"
      enabled: false
      check_method: "process_regex"
      process_pattern: "php-fpm.*master"
      restart_command:
        - "systemctl restart php*-fpm"
      critical: true
      description: "PHP-FPM master process"

    # -------------------------------------------------------------------------
    # Common Ubuntu web server services (disabled by default)
    # -------------------------------------------------------------------------
    - name: "apache2"
      enabled: false
      check_method: "systemctl"
      service_name: "apache2"
      restart_command: "systemctl restart apache2"
      critical: true
      description: "Apache HTTP server"

    - name: "mysql"
      enabled: false
      check_method: "systemctl"
      service_name: "mysql"
      restart_command: "systemctl restart mysql"
      critical: true
      description: "MySQL database service"

    - name: "mariadb"
      enabled: false
      check_method: "systemctl"
      service_name: "mariadb"
      restart_command: "systemctl restart mariadb"
      critical: true
      description: "MariaDB database service"

    - name: "postgresql"
      enabled: false
      check_method: "systemctl"
      service_name: "postgresql"
      restart_command: "systemctl restart postgresql"
      critical: true
      description: "PostgreSQL database service"

    - name: "redis"
      enabled: false
      check_method: "systemctl"
      service_name: "redis-server"
      restart_command: "systemctl restart redis-server"
