    - name: "vsftpd"
      enabled: false
      check_method: "systemctl"
      service_name: "vsftpd"
      restart_command: "systemctl restart vsftpd"
      critical: false
      description: "VSFTPD FTP server"

    - name: "proftpd"
      enabled: false
      check_method: "systemctl"
      service_name: "proftpd"
      restart_command: "systemctl restart proftpd"
      critical: false
      description: "ProFTPD FTP server"

    - name: "pure-ftpd"
      enabled: false
      check_method: "systemctl"
      service_name: "pure-ftpd"
      restart_command: "systemctl restart pure-ftpd"
      critical: false
      description: "Pure-FTPd FTP server"

    - name: "hestia"
      enabled: false
      check_method: "systemctl"
      service_name: "hestia"
      restart_command: "systemctl restart hestia"
      critical: true
      description: "HestiaCP control panel service"

    # Example: HTTP/HTTPS web endpoint monitoring
    - name: "web_homepage"
      enabled: false
      check_method: "https"
      # Optional per-service proxy override for HTTP/HTTPS checks
      # proxy:
      #   enabled: true
      #   uri: "${PROXY_URI}"
      # Target URL for health check.
      # Supports a single URL string or a list of URLs.
      url:
        - "https://example-01.com/health"
        - "https://example-02.com/zhealth"
      # URL failure logic when multiple targets are configured:
      # or  -> any failed target triggers recovery
      # and -> all targets must fail before recovery runs
      condition: "or"
      # HTTP method: GET, HEAD, POST, ...
      http_method: "GET"
      # Optional request headers
      headers:
        User-Agent: "xnetvn_monitord"
      # Timeout for HTTP request (seconds)
      timeout_seconds: 10
      # Expected HTTP status codes
      expected_status_codes: [200, 204, 301, 302]
      # Fail if response is slower than this threshold (ms)
      max_response_time_ms: 1500
      # Verify TLS certificates (https only)
      verify_tls: true
      # Optional recovery action (e.g., restart nginx)
      restart_command: 
        - "systemctl restart php*-fpm"
        - "systemctl restart nginx"
        #- "systemctl restart mariadb" # Additional command
        #- "bash /path/to/scripts/custom-restart.sh" # Custom script
        #- "python /path/to/scripts/custom-restart.py"

      # Optional: check systemd unit existence before action
      service_name: "nginx"
      critical: true
      description: "Public web health check"

    # -------------------------------------------------------------------------
    # Local web endpoints (disabled by default)
    # -------------------------------------------------------------------------
    - name: "localhost_http"
      enabled: false
      check_method: "http"
      url: "http://127.0.0.1/"
      http_method: "GET"
      timeout_seconds: 5
      expected_status_codes: [200, 204, 301, 302]
      max_response_time_ms: 1000
      restart_command: "systemctl restart nginx"
      service_name: "nginx"
      critical: false
